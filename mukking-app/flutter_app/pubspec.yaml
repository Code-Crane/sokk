name: mukking_flutter_app
description: Mukking mobile app rebuilt with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  geolocator: ^14.0.3
  go_router: ^14.8.1
  kakao_maps_flutter: ^0.2.2
  shared_preferences: ^2.5.2
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pets/